<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #f3e3c3;
    --ink-dim: rgba(243, 227, 195, 0.55);
    --brass: #e0b45e;
    --panel: rgba(20, 13, 8, 0.66);
    --line: rgba(224, 180, 94, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0906; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 42%, #3a2616 0%, #1c120b 52%, #090604 100%);
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.42) 100%);
  }
  .hud { position: fixed; pointer-events: none; font-variant-numeric: tabular-nums; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  #tl { top: 16px; left: 16px; }
  #tr { top: 16px; right: 16px; text-align: right; }
  #bc { bottom: 16px; left: 50%; transform: translateX(-50%); text-align: center; }
  #br { bottom: 16px; right: 16px; pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .title { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); }
  .sub { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim); margin-top: 2px; }
  .row { display: flex; align-items: baseline; gap: 10px; margin-top: 5px; font-size: 17px; }
  .row .lab { color: var(--brass); width: 14px; font-weight: 600; }
  .bits { letter-spacing: 0.22em; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; }
  .dec { color: var(--ink-dim); font-size: 15px; min-width: 2.2em; text-align: right; }
  .count { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 30px; line-height: 1; color: var(--ink); margin-top: 4px; }
  .small { font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-dim); }
  #result { display: flex; align-items: baseline; justify-content: center; gap: 14px; margin-top: 4px; }
  #rbits { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 34px; letter-spacing: 0.24em; transition: color .4s, opacity .4s; }
  #rdec { font-size: 34px; color: var(--brass); min-width: 2.6em; text-align: left; transition: opacity .4s; }
  #rbits.live { color: var(--ink-dim); }
  #status { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-dim); min-height: 14px; }

    pointer-events: auto; cursor: pointer;
    font: 600 12px/1 "Iowan Old Style", Palatino, Georgia, serif; letter-spacing: 0.3em; text-transform: uppercase;
    color: #1b1108; background: linear-gradient(#f0c877, #b8863a); border: 1px solid #f6d99a;

    .row { font-size: 15px; } .bits { font-size: 14px; }

<body>
<canvas id="c" tabindex="0"></canvas>
<div class="vignette"></div>

<div class="hud panel" id="tl">
  <div class="title">Marble Adder</div>
  <div class="sub">four bit binary adder &middot; marbles and toggles only</div>
  <div class="row"><span class="lab">A</span><span class="bits" id="abits">0000</span><span class="dec" id="adec">0</span></div>
  <div class="row"><span class="lab">B</span><span class="bits" id="bbits">0000</span><span class="dec" id="bdec">0</span></div>
</div>

  <div class="small">Marbles dropped</div>
  <div class="count" id="count">00</div>
</div>

  <div id="status">ready</div>
  <div id="result"><span id="rbits">00000</span><span id="rdec">&nbsp;</span></div>
</div>

  <button id="demo" type="button">Demo</button>
  <div class="hint">click the brass switches to set A and B<br>pull the RUN lever (or press space)</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ==========================================================================
   Marble Adder
   The sum is never computed in code. Marbles fall through brass rocker
   toggles; every flip is caused by a marble landing on (or a clear ball
   striking) a toggle. The readout is read back from the toggle states.
   ========================================================================== */

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const DEG = Math.PI / 180;

/* ---------- physical constants ---------- */
const G = 9.81;
const R_GLASS = 0.0125;          // 25 mm glass marbles
const R_BALL = 0.016;            // 32 mm steel clear ball
const ROLL_K = 5 / 7;            // rolling solid sphere
const ROLL_FRICTION = 0.16;      // m/s^2
const BOARD_TILT = 5 * DEG;      // board leans back like an easel

/* ---------- layout (board local, metres) ---------- */
const ZT = 0.075;                // main track plane
const ZF = ZT + 0.05;            // front plane (B row, clear lane)
const NBITS = 5;
const X = [0.36, 0.18, 0.0, -0.18, -0.36];   // toggle pivots, bit 0 on the right
const Y = [0.86, 0.76, 0.66, 0.56, 0.46];
const TILT = 15 * DEG;           // rocker tilt
const CUP = V3(0.045, 0.014);    // marble centre resting in a cup (local, right cup)
const LIP_X = 0.068;
const FUN_OUT = 0.042;           // funnel outlet height above pivot
const FUN_TOP = 0.064;
const FUN_R = 0.026;

const RAIL_SLOPE = 0.055;
const LIFT_X = -0.775, LIFT_Y1 = 1.205, LIFT_AXIS_Z = ZT - 0.036;
const yA = x => 1.19 - (x + 0.72) * RAIL_SLOPE;          // A rail marble line
const yB = x => 1.062 - (0.455 - x) * RAIL_SLOPE;        // B rail marble line
const SORT_X = 0.455, PARK_X = 0.548;
const GUT_SLOPE = Math.tan(13 * DEG);
const yG = x => 0.37 + (x + 0.275) * GUT_SLOPE;          // gutter marble line
const TRIP_X = -0.497;
const POCKET_DIP = 0.009;

// clear lane: passes just above where each flag tip sits when its toggle holds a 1
const LANE_DIR = V3(-0.18, -0.10, 0).normalize();
const LANE_P0 = V3(X[0] - 0.0596, Y[0] + 0.0413, ZF);
const laneY = x => LANE_P0.y + (x - LANE_P0.x) * (0.10 / 0.18);

/* ---------- path: rounded polyline, arc length parameterised ---------- */
class Path {
  constructor(points) {
    this.p = points;
    this.L = new Float64Array(points.length);
    for (let i = 1; i < points.length; i++) this.L[i] = this.L[i - 1] + points[i].distanceTo(points[i - 1]);
    this.length = this.L[points.length - 1];
  }
  static fromWaypoints(wps, radius = 0.03, step = 0.004) {
    const pts = [wps[0].clone()];
    const n = wps.length;
    let cur = wps[0].clone();
    for (let i = 1; i < n; i++) {
      const P = wps[i];
      if (i === n - 1) { Path._lineTo(pts, cur, P, step); cur = P.clone(); break; }
      const din = P.clone().sub(wps[i - 1]); const lin = din.length(); din.divideScalar(lin);
      const dout = wps[i + 1].clone().sub(P); const lout = dout.length(); dout.divideScalar(lout);
      const cosA = clamp(din.dot(dout), -1, 1);
      const ang = Math.acos(cosA);
      let t = ang < 1e-3 ? 0 : radius * Math.tan(ang / 2);
      t = Math.min(t, lin * 0.5, lout * 0.5);
      const a = P.clone().addScaledVector(din, -t), b = P.clone().addScaledVector(dout, t);
      Path._lineTo(pts, cur, a, step);
      if (t > 0) {
        const segs = Math.max(2, Math.ceil((2 * t) / step));
        for (let k = 1; k <= segs; k++) {
          const u = k / segs, w = 1 - u;
          pts.push(V3(
            w * w * a.x + 2 * w * u * P.x + u * u * b.x,
            w * w * a.y + 2 * w * u * P.y + u * u * b.y,
            w * w * a.z + 2 * w * u * P.z + u * u * b.z));
        }
      }
      cur = b.clone();
    }
    // drop duplicates
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) if (pts[i].distanceTo(out[out.length - 1]) > 1e-5) out.push(pts[i]);
    return new Path(out);
  }
  static _lineTo(pts, a, b, step) {
    const d = a.distanceTo(b); const segs = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= segs; k++) pts.push(a.clone().lerp(b, k / segs));
  }
  _idx(s) {
    const L = this.L; let lo = 0, hi = L.length - 1;
    if (s <= 0) return 0; if (s >= this.length) return L.length - 2;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (L[m] <= s) lo = m; else hi = m; }
    return lo;
  }
  pointAt(s, out = V3()) {
    const i = this._idx(s); const seg = this.L[i + 1] - this.L[i];
    const u = seg > 0 ? clamp((s - this.L[i]) / seg, 0, 1) : 0;
    return out.copy(this.p[i]).lerp(this.p[i + 1], u);
  }
  tangentAt(s, out = V3()) {
    const i = this._idx(s);
    return out.copy(this.p[i + 1]).sub(this.p[i]).normalize();
  }
  closestS(q) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < this.p.length; i++) { const d = this.p[i].distanceToSquared(q); if (d < bd) { bd = d; best = this.L[i]; } }
    return best;
  }
  get start() { return this.p[0]; }
  get end() { return this.p[this.p.length - 1]; }
}

/* ---------- geometry helpers ---------- */
function mergeGeometries(geos) {
  let vCount = 0, iCount = 0;
  const prepared = geos.map(g => { const gi = g.index ? g : indexify(g); vCount += gi.attributes.position.count; iCount += gi.index.count; return gi; });
  const pos = new Float32Array(vCount * 3), nor = new Float32Array(vCount * 3), uv = new Float32Array(vCount * 2);
  const idx = vCount > 65535 ? new Uint32Array(iCount) : new Uint16Array(iCount);
  let vo = 0, io = 0;
  for (const g of prepared) {
    const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
    pos.set(P.array, vo * 3);
    if (N) nor.set(N.array, vo * 3);
    if (U) uv.set(U.array, vo * 2);
    const I = g.index.array;
    for (let k = 0; k < I.length; k++) idx[io + k] = I[k] + vo;
    vo += P.count; io += I.length;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}
function indexify(g) {
  const n = g.attributes.position.count; const I = [];
  for (let i = 0; i < n; i++) I.push(i);
  g.setIndex(I); return g;
}
// tube along a list of points (polyline), used for rails, rods and wires
function tubeAlong(points, radius, radial = 6, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal', 0.0);
  let len = 0; for (let i = 1; i < points.length; i++) len += points[i].distanceTo(points[i - 1]);
  const segs = Math.max(2, Math.min(400, Math.ceil(len / 0.006)));
  return new THREE.TubeGeometry(curve, segs, radius, radial, closed);
}
function rodBetween(a, b, radius, radial = 8) {
  const d = b.clone().sub(a); const len = d.length();
  const g = new THREE.CylinderGeometry(radius, radius, len, radial, 1, false);
  const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), d.normalize());
  g.applyQuaternion(q); const m = a.clone().add(b).multiplyScalar(0.5);
  g.translate(m.x, m.y, m.z); return g;
}
function sphereAt(p, r, seg = 10) { const g = new THREE.SphereGeometry(r, seg, Math.max(6, seg >> 1)); g.translate(p.x, p.y, p.z); return g; }

// frame along a path: tangent t, side b (horizontal-ish), down n
function frameAt(path, s) {
  const t = path.tangentAt(s);
  const up = Math.abs(t.y) > 0.97 ? V3(0, 0, 1) : V3(0, 1, 0);
  const b = V3().crossVectors(t, up).normalize();
  const n = V3().crossVectors(b, t).normalize().negate(); // points "down" relative to track
  return { t, b, n };
}
// two-rod rail under a marble path. spread: half distance between rods
function railRods(path, marbleR, s0 = 0, s1 = path.length, opts = {}) {
  const rodR = opts.rodR ?? 0.0022, spread = opts.spread ?? marbleR * 0.72;
  const depth = Math.sqrt(Math.max(0, (marbleR + rodR) ** 2 - spread ** 2));
  const L = [], Rr = []; const step = 0.006;
  const n = Math.max(2, Math.ceil((s1 - s0) / step));
  for (let i = 0; i <= n; i++) {
    const s = lerp(s0, s1, i / n); const f = frameAt(path, s); const c = path.pointAt(s);
    L.push(c.clone().addScaledVector(f.n, depth).addScaledVector(f.b, spread));
    Rr.push(c.clone().addScaledVector(f.n, depth).addScaledVector(f.b, -spread));
  }
  return [tubeAlong(L, rodR), tubeAlong(Rr, rodR)];
}
// ties (little cross pieces) that hold the rods, with a standoff post back to the board
function railTies(path, marbleR, s0, s1, every = 0.07, opts = {}) {
  const out = []; const rodR = opts.rodR ?? 0.0022, spread = opts.spread ?? marbleR * 0.72;
  const depth = Math.sqrt(Math.max(0, (marbleR + rodR) ** 2 - spread ** 2));
  const count = Math.max(1, Math.floor((s1 - s0) / every));
  for (let i = 0; i <= count; i++) {
    const s = lerp(s0 + 0.01, s1 - 0.01, count ? i / count : 0.5); const f = frameAt(path, s); const c = path.pointAt(s);
    const base = c.clone().addScaledVector(f.n, depth + 0.004);
    const a = base.clone().addScaledVector(f.b, spread + 0.004), b = base.clone().addScaledVector(f.b, -spread - 0.004);
    out.push(rodBetween(a, b, 0.0022, 6));
    if (opts.posts !== false) {
      const back = base.clone(); back.z = 0.002;
      if (base.z - back.z > 0.01) out.push(rodBetween(base, back, 0.0024, 6));
    }
  }
  return out;
}
// vertical cage of three rods (left, back, right) with open-front rings
function cageRods(top, bottom, marbleR, opts = {}) {
  const out = []; const rr = marbleR + 0.0045; const rodR = 0.0018;
  const angles = opts.angles ?? [Math.PI, Math.PI * 1.5, 0];
  for (const a of angles) {
    const o = V3(Math.cos(a) * rr, 0, Math.sin(a) * rr);
    out.push(rodBetween(top.clone().add(o), bottom.clone().add(o), rodR, 6));
  }
  const h = top.y - bottom.y; const rings = Math.max(1, Math.round(h / 0.09));
  for (let i = 0; i <= rings; i++) {
    const y = lerp(bottom.y + 0.01, top.y - 0.01, i / rings);
    const tg = new THREE.TorusGeometry(rr, 0.0017, 5, 18, Math.PI * 1.25);
    tg.rotateX(Math.PI / 2); tg.rotateY(-0.875 * Math.PI); tg.translate(top.x, y, top.z);
    out.push(tg);
  }
  return out;
}

/* ---------- random ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ==========================================================================
   Renderer, scene, lighting
   ========================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.05, 30);
camera.position.set(0.1, 1.05, 3.3);

// procedural studio environment: warm softboxes in a dark room
function buildEnvironment() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = vP.y; vec3 top = vec3(0.22,0.17,0.12); vec3 mid = vec3(0.11,0.08,0.055); vec3 bot = vec3(0.035,0.025,0.017); vec3 c = h > 0.0 ? mix(mid, top, h) : mix(mid, bot, -h); gl_FragColor = vec4(c, 1.0); }'
  }));
  env.add(room);
  const box = (w, h, color, intensity, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(0, 0.6, 0); env.add(m);
  };
  box(4.0, 3.0, 0xffd7a8, 5.0, V3(-4.5, 5.0, 5.5));   // key softbox
  box(2.5, 5.0, 0xffe6c7, 1.6, V3(6.5, 2.5, 3.5));    // fill
  box(8.0, 0.6, 0xfff1dd, 3.0, V3(0, 7.5, -2.0));     // top strip
  box(1.2, 4.0, 0xffc98a, 2.2, V3(-7.0, 1.5, -3.0));  // warm kicker
  box(6.0, 2.5, 0xfff0dc, 1.1, V3(0.5, 4.2, 8.0));    // soft front bounce, high so the board does not mirror it
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(env, 0.035);
  pmrem.dispose();
  env.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  return rt.texture;
}
const envTex = buildEnvironment();
scene.environment = envTex;

const keyLight = new THREE.DirectionalLight(0xffd3a1, 3.3);
keyLight.position.set(-1.6, 2.6, 2.4);
keyLight.target.position.set(-0.02, 0.72, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -1.05, right: 1.05, top: 1.0, bottom: -1.0, near: 1.0, far: 7.0 });
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.012;
keyLight.shadow.radius = 3;
scene.add(keyLight, keyLight.target);
const hemi = new THREE.HemisphereLight(0xffe2c0, 0x2a1a10, 0.32);
scene.add(hemi);
const rim = new THREE.DirectionalLight(0xcfe0ff, 0.55);
rim.position.set(2.2, 2.0, -1.4);
scene.add(rim);
const warmPool = new THREE.SpotLight(0xffb870, 7.0, 6, 32 * DEG, 0.75, 1.6);
warmPool.position.set(1.4, 2.4, 2.2);
warmPool.target.position.set(0.05, 0.75, 0);
scene.add(warmPool, warmPool.target);

/* ---------- materials ---------- */
const MAT = {};
function std(params) { const m = new THREE.MeshStandardMaterial(params); m.envMap = envTex; return m; }
MAT.brass = std({ color: 0xd9a74c, metalness: 1, roughness: 0.3, envMapIntensity: 1.25 });
MAT.brassRail = std({ color: 0xc3913f, metalness: 1, roughness: 0.34, envMapIntensity: 1.15 });
MAT.brassBright = std({ color: 0xe8b95b, metalness: 1, roughness: 0.27, envMapIntensity: 1.45 });
MAT.brassDark = std({ color: 0x8c6a33, metalness: 1, roughness: 0.42, envMapIntensity: 1.0 });
MAT.steel = std({ color: 0xe9e9ee, metalness: 1, roughness: 0.1, envMapIntensity: 1.6 });
MAT.blackEnamel = std({ color: 0x14100d, metalness: 0.0, roughness: 0.28, envMapIntensity: 1.0 });
MAT.redEnamel = std({ color: 0xb4231a, metalness: 0.1, roughness: 0.32, envMapIntensity: 1.0 });
MAT.ivory = std({ color: 0xf0e2c4, metalness: 0.0, roughness: 0.38, envMapIntensity: 0.8 });
MAT.walnut = std({ color: 0x6a4428, metalness: 0.0, roughness: 0.55, envMapIntensity: 0.7 });
MAT.walnutDark = std({ color: 0x3e2716, metalness: 0.0, roughness: 0.6, envMapIntensity: 0.6 });
MAT.trough = std({ color: 0x7a5230, metalness: 0.0, roughness: 0.5, envMapIntensity: 0.8, side: THREE.DoubleSide });
MAT.funnel = std({ color: 0xf0c56a, metalness: 0.85, roughness: 0.34, envMapIntensity: 1.9, side: THREE.DoubleSide });

function glassMaterial(tint) {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.02, ior: 1.52,
    attenuationColor: tint, attenuationDistance: 0.024, clearcoat: 1, clearcoatRoughness: 0.02,

/* ---------- procedural wood ---------- */
function woodCanvas(w, h, pal, seed, grainDensity, warpAmt) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h); const d = img.data;
  const rnd = mulberry32(seed);
  const N = 2048; const stripe = new Float32Array(N);
  for (let i = 0; i < N; i++) stripe[i] = rnd();
  for (let pass = 0; pass < 3; pass++) for (let i = 0; i < N; i++) stripe[i] = (stripe[(i + N - 1) % N] + stripe[i] * 2 + stripe[(i + 1) % N]) / 4;
  const lo = Math.min(...stripe), hi = Math.max(...stripe);
  for (let i = 0; i < N; i++) stripe[i] = (stripe[i] - lo) / (hi - lo);
  const colW = new Float32Array(w); const ph1 = rnd() * 6.28, ph2 = rnd() * 6.28;
  for (let x = 0; x < w; x++) colW[x] = Math.sin(x / w * 5.3 + ph1) * 0.6 + Math.sin(x / w * 13.1 + ph2) * 0.25;
  const [b0, b1, b2] = pal.base, [g0, g1, g2] = pal.grain;
  for (let y = 0; y < h; y++) {
    const vy = y / h;
    for (let x = 0; x < w; x++) {
      const warp = (colW[x] + Math.sin(x * 0.0041 + vy * 9.0 + ph2) * 0.35) * warpAmt;
      const gpos = (vy + warp) * grainDensity;
      const fi = gpos - Math.floor(gpos); const idx = (Math.floor(gpos) % N + N) % N;
      const sv = stripe[idx] * (1 - fi) + stripe[(idx + 1) % N] * fi;
      let k = Math.pow(sv, 3.2) * 0.85 + (rnd() - 0.5) * 0.06;
      k = clamp(k, 0, 1);
      const o = (y * w + x) * 4;
      d[o] = b0 + (g0 - b0) * k; d[o + 1] = b1 + (g1 - b1) * k; d[o + 2] = b2 + (g2 - b2) * k; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // soft broad colour variation
  for (let i = 0; i < 9; i++) {
    const gx = rnd() * w, gy = rnd() * h, gr = (0.2 + rnd() * 0.4) * Math.max(w, h);
    const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    const a = 0.05 + rnd() * 0.06;
    grd.addColorStop(0, rnd() > 0.5 ? `rgba(255,236,200,${a})` : `rgba(120,70,30,${a})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
  }
  return c;
}

const BUCKET = new Map();                 // material -> geometries to merge
function put(mat, geo) { if (!BUCKET.has(mat)) BUCKET.set(mat, []); if (Array.isArray(geo)) BUCKET.get(mat).push(...geo); else BUCKET.get(mat).push(geo); }

const P = k => V3(X[k], Y[k], ZT);
const rotZ = (v, a) => V3(v.x * Math.cos(a) - v.y * Math.sin(a), v.x * Math.sin(a) + v.y * Math.cos(a), v.z || 0);
const tiltOf = st => (st ? -TILT : TILT);         // state 0 = left side down, state 1 = right side down

const PATHS = {};
const TRAY_START_X = -0.52;
const TRAY_END = V3(LIFT_X, yG(TRAY_START_X) - (TRAY_START_X - LIFT_X) * Math.tan(5 * DEG), ZT);
const LIFT_Y0 = TRAY_END.y;

/* --- A rail (top, main plane): lift top -> pockets A8..A1 -> size sorter -> ball park --- */
PATHS.A = Path.fromWaypoints([
  V3(LIFT_X, LIFT_Y1, ZT), V3(LIFT_X + 0.028, yA(LIFT_X + 0.028) + 0.004, ZT), V3(-0.64, yA(-0.64), ZT), V3(PARK_X, yA(PARK_X), ZT)
], 0.03);
/* --- B rail (front plane): glass marbles drop through the sorter gap, roll right to left past B1..B8 --- */
PATHS.B = Path.fromWaypoints([
  V3(SORT_X, yA(SORT_X), ZT), V3(SORT_X, yA(SORT_X) - 0.03, ZT), V3(SORT_X - 0.006, yB(SORT_X) + 0.014, ZF),
  V3(SORT_X - 0.05, yB(SORT_X - 0.05), ZF), V3(-0.245, yB(-0.245), ZF)
], 0.022);

/* --- pockets --- */
const POCKETS = [];   // index: 0..3 = A bit0..3, 4..7 = B bit0..3
for (let i = 0; i < 8; i++) {

  const rest = V3(x, railY - POCKET_DIP, z);

  if (row === 'A') drop = Path.fromWaypoints([rest, V3(x, Y[bit] + FUN_TOP + 0.012, ZT), funnelOut(bit)], 0.01);
  else drop = Path.fromWaypoints([rest, V3(x, railY - 0.032, ZF), V3(x, railY - 0.078, ZT), V3(x, Y[bit] + FUN_TOP + 0.012, ZT), funnelOut(bit)], 0.016);
  POCKETS.push({ i, row, bit, x, rest, path, s, drop, marble: null, reserved: false, gateOpen: 0, gateTarget: 0, sw: 0, swAnim: 0 });
}
PATHS.A_sortS = PATHS.A.closestS(V3(SORT_X, yA(SORT_X), ZT));

/* --- clear ball: park -> hairpin -> lane in front of the toggles -> down into the gutter --- */

PATHS.clear = Path.fromWaypoints([
  V3(PARK_X, yA(PARK_X) + 0.0042, ZT), V3(0.592, yA(0.592) + 0.002, ZT), V3(0.648, 1.098, ZT + 0.03), V3(0.646, laneY(0.646) + 0.004, ZF),
  V3(LANE_X1 - 0.01, laneY(LANE_X1 - 0.01), ZF), V3(LANE_X0, laneY(LANE_X0), ZF),
  V3(LANE_X0 - 0.026, laneY(LANE_X0) - 0.03, ZF - 0.005), V3(-0.49, yG(-0.49) + 0.05, ZT + 0.012), V3(-0.492, yG(-0.492) + 0.0035, ZT)
], 0.03);
PATHS.clearFlagS = [];
for (let k = 0; k < NBITS; k++) {

const TOG = [];

  const cupHi1 = rotZ(V3(-CUP.x, CUP.y), -TILT);  // left cup while in state 1
  t.land = [
    Path.fromWaypoints([funnelOut(k), rel(k, 0.012, 0.037), rel(k, cupHi0.x, cupHi0.y)], 0.01),
    Path.fromWaypoints([funnelOut(k), rel(k, -0.012, 0.037), rel(k, cupHi1.x, cupHi1.y)], 0.01)];
  const lowR = rotZ(CUP, -TILT), lowL = rotZ(V3(-CUP.x, CUP.y), TILT);

  t.doneJoinS = PATHS.gutter.closestS(V3(gx, yG(gx), ZT));

/* --- lift --- */
const LIFT = { pitch: 0.08, revPerSec: 5.0, angle: 0, speed: 0, running: false };

/* ==========================================================================
   Static geometry
   ========================================================================== */
function buildStatic() {
  const rodOpts = { rodR: 0.0022 };
  // spread the A and B rail rods apart over each pocket and the sorter gap
  const spreadFn = (path, centres) => s => {
    let sp = R_GLASS * 0.72;
    for (const c of centres) { const d = Math.abs(s - c); if (d < 0.03) sp = Math.max(sp, lerp(0.0155, R_GLASS * 0.72, smooth(clamp((d - 0.012) / 0.018, 0, 1)))); }
    return sp;
  };
  const variableRail = (path, s0, s1, spreadAt, marbleR, mat) => {
    const rodR = 0.0022; const L = [], Rr = []; const n = Math.max(2, Math.ceil((s1 - s0) / 0.004));
    for (let i = 0; i <= n; i++) {
      const s = lerp(s0, s1, i / n); const f = frameAt(path, s); const c = path.pointAt(s); const sp = spreadAt(s);
      const depth = Math.sqrt(Math.max(0, (marbleR + rodR) ** 2 - sp ** 2));
      L.push(c.clone().addScaledVector(f.n, depth).addScaledVector(f.b, sp));
      Rr.push(c.clone().addScaledVector(f.n, depth).addScaledVector(f.b, -sp));
    }
    put(mat, [tubeAlong(L, rodR), tubeAlong(Rr, rodR)]);
  };
  // A rail
  const aCentres = POCKETS.filter(p => p.row === 'A').map(p => p.s).concat([PATHS.A_sortS]);
  const aStart = PATHS.A.closestS(V3(LIFT_X + 0.03, yA(LIFT_X + 0.03), ZT));
  variableRail(PATHS.A, aStart, PATHS.A.length + 0.004, spreadFn(PATHS.A, aCentres), R_GLASS, MAT.brassRail);
  put(MAT.brassDark, railTies(PATHS.A, R_GLASS, aStart + 0.02, PATHS.A.length - 0.01, 0.12));
  // ball park end stop block
  { const e = V3(PARK_X + R_BALL + 0.006, yA(PARK_X) - 0.004, ZT); const g = new THREE.BoxGeometry(0.008, 0.03, 0.03); g.translate(e.x + 0.02, e.y - 0.01, e.z); put(MAT.brassDark, g); }
  // B rail
  const bCentres = POCKETS.filter(p => p.row === 'B').map(p => p.s);
  variableRail(PATHS.B, PATHS.B_railStart, PATHS.B.length, spreadFn(PATHS.B, bCentres), R_GLASS, MAT.brassRail);
  put(MAT.brassDark, railTies(PATHS.B, R_GLASS, PATHS.B_railStart + 0.02, PATHS.B.length - 0.005, 0.12));
  { const e = PATHS.B.end; const g = new THREE.BoxGeometry(0.006, 0.026, 0.03); g.translate(e.x - R_GLASS - 0.004, e.y + 0.002, e.z); put(MAT.brassDark, g); }
  // sorter drop guide (front + back rods of the little chute)
  { const sd = PATHS.B; const pts1 = [], pts2 = [];
    for (let s = 0.004; s < PATHS.B_railStart; s += 0.004) { const f = frameAt(sd, s); const c = sd.pointAt(s); pts1.push(c.clone().addScaledVector(f.b, 0.0165).addScaledVector(f.n, 0.004)); pts2.push(c.clone().addScaledVector(f.b, -0.0165).addScaledVector(f.n, 0.004)); }
    if (pts1.length > 2) put(MAT.brassRail, [tubeAlong(pts1, 0.0018), tubeAlong(pts2, 0.0018)]); }
  // column cages and B chutes
  for (const p of POCKETS) {
    if (p.row === 'A') {
      put(MAT.brassRail, cageRods(V3(p.x, p.rest.y - 0.016, ZT), V3(p.x, Y[p.bit] + FUN_TOP + 0.004, ZT), R_GLASS));
      // gate hinge bracket
    } else {
      const d = p.drop; const s1 = d.closestS(V3(p.x, yB(p.x) - 0.078, ZT));
      const L = [], Rr = [];
      for (let s = 0.02; s <= s1; s += 0.004) { const f = frameAt(d, s); const c = d.pointAt(s); L.push(c.clone().addScaledVector(f.b, 0.0165)); Rr.push(c.clone().addScaledVector(f.b, -0.0165)); }
      put(MAT.brassRail, [tubeAlong(L, 0.0018), tubeAlong(Rr, 0.0018)]);
    }
  }
  // funnels
  const funnelProfile = [V3(0.0152, 0), V3(0.0162, 0.006), V3(0.021, 0.014), V3(FUN_R, FUN_TOP - FUN_OUT), V3(FUN_R + 0.0015, FUN_TOP - FUN_OUT + 0.0015)].map(v => new THREE.Vector2(v.x, v.y));
  for (let k = 0; k < NBITS; k++) {
    const g = new THREE.LatheGeometry(funnelProfile, 28); g.translate(X[k], Y[k] + FUN_OUT - 0.006, ZT); put(MAT.funnel, g);
    const ring = new THREE.TorusGeometry(FUN_R + 0.002, 0.0022, 6, 28); ring.rotateX(Math.PI / 2); ring.translate(X[k], Y[k] + FUN_TOP - 0.004, ZT); put(MAT.brassBright, ring);
    // funnel bracket to the board
    put(MAT.brassDark, rodBetween(V3(X[k], Y[k] + FUN_TOP - 0.01, ZT - FUN_R), V3(X[k], Y[k] + FUN_TOP - 0.01, 0.002), 0.003));
    // pivot boss + standoff
    put(MAT.brassDark, rodBetween(V3(X[k], Y[k], 0.001), V3(X[k], Y[k], ZT - 0.02), 0.006, 14));
    { const g2 = new THREE.CylinderGeometry(0.014, 0.016, 0.006, 24); g2.rotateX(Math.PI / 2); g2.translate(X[k], Y[k], 0.003); put(MAT.brass, g2); }
  }
  // carry ramps and done chutes
  for (let k = 0; k < NBITS; k++) {
    const t = TOG[k];
    if (k < NBITS - 1) {
      const c = t.carry; const s0 = c.closestS(rel(k, -0.074, -0.003)), s1 = c.closestS(rel(k, -0.15, -0.024));
      put(MAT.brassRail, railRods(c, R_GLASS, s0, s1, rodOpts));
      put(MAT.brassDark, railTies(c, R_GLASS, s0 + 0.01, s1 - 0.005, 0.05));
    }
    const d = t.done; const s0 = d.closestS(rel(k, 0.074, -0.004)), s1 = d.closestS(rel(k, 0.092, -0.03));
    put(MAT.brassRail, railRods(d, R_GLASS, s0, s1, rodOpts));
    const gx = X[k] + 0.093;
    if (Y[k] - 0.035 - yG(gx) > 0.03) put(MAT.brassRail, cageRods(V3(gx, Y[k] - 0.03, ZT), V3(gx, yG(gx) + 0.018, ZT), R_GLASS, { angles: [Math.PI, Math.PI * 1.5, 0] }));
  }
  // clear lane
  {
    const c = PATHS.clear; const s0 = c.closestS(V3(0.60, yA(0.60), ZT)) + 0.01;
    put(MAT.brassRail, railRods(c, R_BALL, s0, PATHS.laneS1 + 0.02, { rodR: 0.0024, spread: R_BALL * 0.68 }));
    put(MAT.brassDark, railTies(c, R_BALL, PATHS.laneS0, PATHS.laneS1, 0.11, { rodR: 0.0024, spread: R_BALL * 0.68 }));
    // hairpin outer guard
    const pts = []; for (let s = s0; s < PATHS.laneS0; s += 0.004) { const f = frameAt(c, s); pts.push(c.pointAt(s).addScaledVector(f.n, -R_BALL - 0.004)); }
    if (pts.length > 2) put(MAT.brassRail, tubeAlong(pts, 0.0018));
    // drop from lane into gutter: guard rods
    const g1 = [], g2 = []; for (let s = PATHS.laneS1 + 0.01; s < c.length - 0.01; s += 0.004) { const f = frameAt(c, s); const p = c.pointAt(s); g1.push(p.clone().addScaledVector(f.b, R_BALL + 0.004)); g2.push(p.clone().addScaledVector(f.b, -R_BALL - 0.004)); }
    if (g1.length > 2) put(MAT.brassRail, [tubeAlong(g1, 0.0018), tubeAlong(g2, 0.0018)]);
  }
  // gutter trough
  {
    const gpath = PATHS.gutter; const inner = R_GLASS + 0.0035; const segs = 14;
    const pos = [], idx = [], uv = [];
    const n = Math.ceil(gpath.length / 0.01);
    for (let i = 0; i <= n; i++) {
      const s = gpath.length * i / n; const f = frameAt(gpath, s); const c = gpath.pointAt(s);
      for (let j = 0; j <= segs; j++) {
        const a = Math.PI * (j / segs);                    // 0..pi across the bottom
        const o = c.clone().addScaledVector(f.b, Math.cos(a) * inner * 1.18).addScaledVector(f.n, Math.sin(a) * inner);
        pos.push(o.x, o.y, o.z); uv.push(s * 4, j / segs);
      }
    }
    for (let i = 0; i < n; i++) for (let j = 0; j < segs; j++) { const a = i * (segs + 1) + j, b = a + segs + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    put(MAT.trough, g);
    // rolled brass lips along both edges
    const e1 = [], e2 = []; for (let i = 0; i <= n; i++) { const s = gpath.length * i / n; const f = frameAt(gpath, s); const c = gpath.pointAt(s); e1.push(c.clone().addScaledVector(f.b, inner * 1.18)); e2.push(c.clone().addScaledVector(f.b, -inner * 1.18)); }
    put(MAT.brass, [tubeAlong(e1, 0.0022), tubeAlong(e2, 0.0022)]);
    // end cap and supports
    const st = gpath.start; const cap = new THREE.CylinderGeometry(inner * 1.2, inner * 1.2, 0.004, 18, 1, false, 0, Math.PI); cap.rotateZ(Math.PI / 2); cap.rotateX(Math.PI); cap.translate(st.x + 0.004, st.y, st.z); put(MAT.brass, cap);
    for (let i = 0; i <= 6; i++) { const s = lerp(0.03, gpath.length - 0.03, i / 6); const c = gpath.pointAt(s); const bot = c.clone(); bot.y -= inner; put(MAT.brassDark, rodBetween(V3(bot.x, bot.y, bot.z - 0.004), V3(bot.x, bot.y, 0.002), 0.0028)); }
  }
}

/* ==========================================================================
   Moving parts
   ========================================================================== */
const HIT = [];                               // click targets
function hitBox(parent, w, h, d, pos, data) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ visible: false }));
  m.position.copy(pos); m.userData = data; parent.add(m); HIT.push(m); return m;
}
function shadowed(o) { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; }
// bake the direct mesh children of a group into one mesh per material (fewer draw calls)
function mergeGroup(g) {
  const byMat = new Map();
  for (const c of g.children.slice()) {
    if (!c.isMesh || c.material.visible === false) continue;
    c.updateMatrix();
    const geo = c.geometry.clone().applyMatrix4(c.matrix);
    if (!byMat.has(c.material)) byMat.set(c.material, []);
    byMat.get(c.material).push(geo); g.remove(c);
  }
  for (const [mat, geos] of byMat) g.add(new THREE.Mesh(mergeGeometries(geos), mat));
  return shadowed(g);
}

/* --- result toggles: brass rockers --- */
function rockerShape() {
  const s = new THREE.Shape();
  const top = [[-0.069, 0.003], [-0.068, 0.0065], [-0.062, 0.0045], [-0.054, 0.0022], [-0.045, 0.0015], [-0.036, 0.0025], [-0.026, 0.0055], [-0.016, 0.0105],

/* --- demo: 5+6, 9+7, 15+15 --- */
const DEMO = { active: false, cases: [['0101', '0110'], ['1001', '0111'], ['1111', '1111']], idx: 0, stage: 'idle', t: 0, flips: [] };
const demoBtn = document.getElementById('demo');
function setDemo(on) {
  DEMO.active = on; DEMO.idx = 0; DEMO.stage = on ? 'waitReady' : 'idle'; DEMO.t = 0;

}
function updateDemo(dt) {

    if (RUNSTATE.phase === 'ready') {
      DEMO.flips = [];
      for (const k of [3, 2, 1, 0]) if (POCKETS[k].sw !== +a[3 - k]) DEMO.flips.push(k);
      for (const k of [3, 2, 1, 0]) if (POCKETS[4 + k].sw !== +b[3 - k]) DEMO.flips.push(4 + k);

  } else if (DEMO.stage === 'running') {

  } else if (DEMO.stage === 'hold') {

/* ==========================================================================

    toggle: (k, v = 1) => click(3000, 1.3, 0.6 * v, 0.05, NOTE[k] * 0.5, 0.2 * v),
    switch: () => click(4300, 2.2, 0.4, 0.03, 2400, 0.05),
    locked: () => click(700, 1.0, 0.35, 0.06),

    gate: () => click(3700, 2.2, 0.22, 0.03),
    trip: () => click(2100, 2.0, 0.2, 0.03, 540, 0.06),

/* ==========================================================================
   Camera: slow, follows the busiest part of the machine
   ========================================================================== */
const controls = new OrbitControls(camera, canvas);

controls.target.set(-0.02, 0.78, 0);
const CAM = { focus: V3(-0.02, 0.78, 0), fv: V3(), dist: 3.2, dv: 0, yaw: 0, pitch: 0.12, extent: 0.4, user: false, userUntil: 0, resync: false };

const OVERVIEW = { c: V3(-0.02, 0.73, 0.05), halfW: 0.9, halfH: 0.66 };
const _w = V3();
function viewDistance(halfW, halfH) {

}
function desiredShot(time) {

    let w = 1;
    if (m.mode === 'attach' && m.obj.position.x < LIFT_X + 0.05) w = 0.5;   // riding the lift
    else if (m.mode === 'path' && m.opts.queue) w = 0.3;                     // rolling home along the gutter
    pts.push([m.obj.position, w]);

  if (pts.length) { c = V3(); let W = 0; for (const [p, w] of pts) { c.addScaledVector(p, w); W += w; } c.divideScalar(W); }

  } else if (R.phase === 'running' && SEQ.mode === 'armed') {

  } else if (R.phase === 'running') {

    focus = V3(0.0, 0.76, ZT); if (c) { focus.x = clamp(c.x * 0.35, -0.08, 0.08); focus.y = clamp(0.76 + (c.y - 0.76) * 0.35, 0.68, 0.84); } h = 0.5;

/* ==========================================================================
   HUD
   ========================================================================== */
const $ = id => document.getElementById(id);
const HUDEL = { abits: $('abits'), adec: $('adec'), bbits: $('bbits'), bdec: $('bdec'), count: $('count'), rbits: $('rbits'), rdec: $('rdec'), status: $('status') };
const hudCache = {};
function setText(key, el, text) { if (hudCache[key] !== text) { hudCache[key] = text; el.textContent = text; } }
function updateHUD() {
  const a = [3, 2, 1, 0].map(k => POCKETS[k].sw).join(''), b = [3, 2, 1, 0].map(k => POCKETS[4 + k].sw).join('');
  setText('ab', HUDEL.abits, a); setText('ad', HUDEL.adec, String(parseInt(a, 2)));
  setText('bb', HUDEL.bbits, b); setText('bd', HUDEL.bdec, String(parseInt(b, 2)));
  setText('c', HUDEL.count, String(RUNSTATE.dropped).padStart(2, '0'));
  const R = RUNSTATE; const live = R.phase === 'starting' || R.phase === 'running';
  if (live || !R.hasResult) {
    setText('rb', HUDEL.rbits, readToggles());
    setText('rd', HUDEL.rdec, live ? '…' : ' ');
    if (!HUDEL.rbits.classList.contains('live')) HUDEL.rbits.classList.add('live');
  } else {
    setText('rb', HUDEL.rbits, R.resultBits);
    setText('rd', HUDEL.rdec, '= ' + parseInt(R.resultBits, 2));
    if (HUDEL.rbits.classList.contains('live')) HUDEL.rbits.classList.remove('live');
  }
  let st = '';
  if (R.phase === 'ready') st = R.hasResult ? 'result held on the toggles · ready' : 'ready · pull RUN';
  else if (R.phase === 'starting') st = 'RUN pulled';
  else if (R.phase === 'running') {
    if (SEQ.mode === 'armed') st = 'clear ball resetting the toggles';
    else if (!R.seqDone) st = SEQ.step <= 4 ? 'feeding A marbles' : 'feeding B marbles';
    else st = 'last marble rolling home';
  } else if (R.phase === 'result') st = 'read from the toggles';
  else if (R.phase === 'refill') st = R.queued ? 'returning marbles · run queued' : 'returning marbles';
  if (DEMO.active && DEMO.cases[DEMO.idx]) {
    const [da, db] = DEMO.cases[DEMO.idx];
    st = `demo ${DEMO.idx + 1}/3 · ${parseInt(da, 2)} + ${parseInt(db, 2)} · ` + st;

/* ==========================================================================
   Input
   ========================================================================== */
const raycaster = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let downAt = null;
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(HIT, false)[0];
  return hit ? hit.object.userData : null;
}
function firstGesture() { SFX.init(); }
window.addEventListener('pointerdown', firstGesture, { passive: true });
window.addEventListener('keydown', firstGesture);
canvas.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointerup', ev => {
  if (!downAt) return; const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]); downAt = null;
  if (moved > 6) return;
  const hit = pick(ev); if (!hit) return;

});
let hoverT = 0;
canvas.addEventListener('pointermove', ev => {
  const n = performance.now(); if (n - hoverT < 60) return; hoverT = n;
  canvas.style.cursor = pick(ev) ? 'pointer' : 'grab';
});
window.addEventListener('keydown', ev => {
  if (ev.code === 'Space' || ev.code === 'Enter') { ev.preventDefault(); requestRun(); }
  else if (ev.key === 'd' || ev.key === 'D') setDemo(!DEMO.active);
});
demoBtn.addEventListener('click', () => { SFX.init(); setDemo(!DEMO.active); });
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
});

/* ==========================================================================
   Per frame animation of the mechanism
   ========================================================================== */
function animateParts(dt) {
  for (const T of TOGGLES) {
    if (T.anim) {
      T.anim.t += dt; const u = clamp(T.anim.t / T.anim.dur, 0, 1);
      T.phi = lerp(T.anim.from, T.anim.to, 1 - (1 - u) * (1 - u));
      if (u >= 1) { T.bounceT = 0; T.bounceFrom = T.anim.from; T.anim = null; }
    } else if (!T.busy && T.bounceT !== undefined && T.bounceT < 0.35) {
      T.bounceT += dt; const to = tiltOf(T.state);
      T.phi = to + (T.bounceFrom - to) * 0.08 * Math.exp(-T.bounceT / 0.05) * Math.abs(Math.sin(T.bounceT * 58));
    }

    T.flash = Math.max(0, (T.flash || 0) - dt * 0.9);

    if (p.gateHold !== undefined && p.gateTarget === 1) { p.gateHold -= dt; if (p.gateHold <= 0) p.gateTarget = 0; }

    p.gate.rotation.z = p.gateOpen * 1.15;
    p.swAnim += (p.sw - p.swAnim) * Math.min(1, dt * 26);
    let wig = 0; if (p.wiggle !== undefined && p.wiggle < 0.4) { p.wiggle += dt; wig = 0.12 * Math.exp(-p.wiggle * 9) * Math.sin(p.wiggle * 60); }

    if (t >= 0.95) LEVER.pullT = -1;
  }

  const tail = rotZ(V3(0, -0.042), -0.12 + LEVER.angle).add(LEVER_PIVOT); tail.z = ZT + 0.004;
  const gp = PARKGATE.group.position.clone().add(V3(0, 0.048, -0.016));

    COUNTER.wheels[i].rotation.x = COUNTER.angles[i];

}

/* ==========================================================================
   Build + loop
   ========================================================================== */
buildStatic();
buildBoardAndStand();
flushBuckets();
// start with A = 6, B = 3 so a first RUN does something
for (const k of [1, 2]) POCKETS[k].sw = 1;
for (const k of [0, 1]) POCKETS[4 + k].sw = 1;
for (const p of POCKETS) p.swAnim = p.sw;
CAM.resync = false;
{ const s = desiredShot(0); CAM.focus.copy(s.focus); CAM.dist = s.dist; CAM.yaw = s.yaw; CAM.pitch = s.pitch; }

const SUB = 1 / 240;
let lastT = performance.now(); let clock = 0;

    for (const m of q) stepMarble(m, h);
    for (const m of MARBLES) if (!q.includes(m)) stepMarble(m, h);
  }
  updateSequencer(dt);
  updateRun(dt);
  updateDemo(dt);
  animateParts(dt);
}
const QUALITY = { level: 0, samples: [], warm: 0 };

  else if (QUALITY.level === 3) { renderer.setPixelRatio(1); keyLight.shadow.mapSize.set(1024, 1024); if (keyLight.shadow.map) { keyLight.shadow.map.dispose(); keyLight.shadow.map = null; } }
}

  const dt = Math.min(0.05, raw); lastT = now; clock += dt;
  governQuality(raw);
  simulate(dt);
  updateCamera(dt, clock);
  updateHUD();
  renderer.render(scene, camera);

requestAnimationFrame(frame);

// hooks for automated checks: inspect state, fast-forward time, park the camera
window.__marble = {
  RUNSTATE, TOGGLES, POCKETS, MARBLES, SEQ, LIFT, GUTTER, DEMO, QUALITY, requestRun, setDemo, toggleSwitch, readToggles,
  advance(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { simulate(1 / 60); clock += 1 / 60; updateCamera(1 / 60, clock); } },
  screenOf(kind, i) {
    const v = kind === 'lever' ? LEVER.group.localToWorld(V3(0, 0.2, 0)) : board.localToWorld(POCKETS[i].swPos.clone().add(V3(0.012, 0, 0)));

  info() { return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures }; },
  bench(n = 20) { const gl = renderer.getContext(); const px = new Uint8Array(4); renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); const t0 = performance.now(); for (let i = 0; i < n; i++) renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return (performance.now() - t0) / n; },
  simBench(n = 600) { const t0 = performance.now(); for (let i = 0; i < n; i++) simulate(1 / 60); return (performance.now() - t0) / n; },
};
